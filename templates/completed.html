<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Taskly - Completed Tasks</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #6c8cff, transparent 40%),
                radial-gradient(circle at bottom right, #9b4dca, transparent 40%),
                linear-gradient(135deg, #17152b, #302052);

            color: white;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
        }

        .back {
            text-decoration: none;
            color: white;

            padding: 10px 18px;

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 10px;
        }

        .card {
            background: rgba(255,255,255,0.1);

            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(20px);

            border-radius: 25px;

            padding: 30px;
        }

        .task {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 18px;

            margin-bottom: 12px;

            border-radius: 15px;

            background: rgba(255,255,255,0.08);
        }

        .task-name {
            text-decoration: line-through;

            opacity: 0.65;
        }

        .completed-label {
            padding: 6px 12px;

            border-radius: 20px;

            background: rgba(46,204,113,0.15);

            color: #6ff0a0;

            font-size: 12px;
        }

        .empty {
            text-align: center;

            padding: 50px;

            color: rgba(255,255,255,0.5);
        }

    </style>

</head>


<body>

<div class="container">

    <div class="header">

        <div>

            <h1>✅ Completed Tasks</h1>

            <p>
                Your finished tasks
            </p>

        </div>

        <a href="/" class="back">
            ← Dashboard
        </a>

    </div>


    <div class="card">

        {% if tasks %}

            {% for task in tasks %}

                <div class="task">

                    <span class="task-name">
                        {{ task[1] }}
                    </span>

                    <span class="completed-label">
                        Completed
                    </span>

                </div>

            {% endfor %}

        {% else %}

            <div class="empty">

                🎉

                <br><br>

                No completed tasks yet!

            </div>

        {% endif %}

    </div>

</div>

</body>

</html>
