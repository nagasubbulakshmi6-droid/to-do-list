<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taskly - Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #6c8cff, transparent 40%),
                radial-gradient(circle at bottom right, #9b4dca, transparent 40%),
                linear-gradient(135deg, #17152b, #302052);

            color: white;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back {
            text-decoration: none;
            color: white;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 10px;
        }

        .profile-card {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: auto;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #6f7cff,
                #a05be8
            );

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;

            margin-bottom: 20px;
        }

        .profile-card h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .profile-card p {
            color: rgba(255,255,255,0.6);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 35px;
        }

        .stat {
            padding: 25px 15px;
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
        }

        .stat h3 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .stat p {
            font-size: 14px;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>👤 My Profile</h1>

        <a href="/" class="back">
            ← Dashboard
        </a>

    </div>


    <div class="profile-card">

        <div class="avatar">
            👤
        </div>

        <h2>{{ username }}</h2>

        <p>Taskly User</p>


        <div class="stats">

            <div class="stat">

                <h3>{{ total_tasks }}</h3>

                <p>Total Tasks</p>

            </div>


            <div class="stat">

                <h3>{{ pending_tasks }}</h3>

                <p>Pending</p>

            </div>


            <div class="stat">

                <h3>{{ completed_tasks }}</h3>

                <p>Completed</p>

            </div>

        </div>

    </div>

</div>

</body>

</html>
